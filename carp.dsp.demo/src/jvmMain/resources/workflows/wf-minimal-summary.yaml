schemaVersion: "1.0"
metadata:
  id: "wf-minimal-summary"
  name: "Minimal Summary"
  description: "Minimal recomposition of the shared library: load and aggregate to daily features, then summarise - no cleaning or plotting. daily-features reads directly from load."
  version: "1.0"
  tags:
    - "heart-rate"
    - "activity"
    - "reuse"

environments:
  env-hr:
    name: "hr-lib"
    kind: "pixi"
    spec:
      pythonVersion:
        - "3.11"
      dependencies:
        - "pypi:pandas"
        - "pypi:matplotlib"

steps:
  - id: "load-hr-steps"
    metadata:
      name: "Load HR + Steps"
      description: "Fetch the open Fitbit dataset and build an hourly HR + step table"
      version: "1.0"
    environmentId: "env-hr"
    dependsOn: []
    task:
      type: "python"
      id: "task-load-hr-steps"
      name: "load-hr-steps"
      entryPoint:
        type: "script"
        scriptPath: "scripts/hr_lib/load_hr_steps.py"
      args:
        - "--output"
        - "output.0"
    outputs:
      - id: "hr-steps-csv"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Hourly wearable data: participant_id, timestamp, heart_rate_bpm, steps"

  - id: "daily-features"
    metadata:
      name: "Daily Features"
      description: "Aggregate hourly data to per-participant per-day features"
      version: "1.0"
    environmentId: "env-hr"
    dependsOn:
      - "load-hr-steps"
    task:
      type: "python"
      id: "task-daily-features"
      name: "daily-features"
      entryPoint:
        type: "script"
        scriptPath: "scripts/hr_lib/daily_features.py"
      args:
        - "--input"
        - "input.0"
        - "--output"
        - "output.0"
    inputs:
      - id: "hr-steps-csv"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Hourly wearable data"
        source:
          type: "step-output"
          stepId: "load-hr-steps"
          outputId: "hr-steps-csv"
    outputs:
      - id: "daily-features-csv"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Daily features: participant_id, date, mean_hr, resting_hr, peak_hr, total_steps, active_hours"

  - id: "summarise"
    metadata:
      name: "Summarise"
      description: "Reduce daily features to a study-level summary"
      version: "1.0"
    environmentId: "env-hr"
    dependsOn:
      - "daily-features"
    task:
      type: "python"
      id: "task-summarise"
      name: "summarise"
      entryPoint:
        type: "script"
        scriptPath: "scripts/hr_lib/summarise.py"
      args:
        - "--input"
        - "input.0"
        - "--output"
        - "output.0"
    inputs:
      - id: "daily-features-csv"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Daily features"
        source:
          type: "step-output"
          stepId: "daily-features"
          outputId: "daily-features-csv"
    outputs:
      - id: "summary-json"
        descriptor:
          fileFormat: "json"
          encoding: "utf-8"
          notes: "Study-level summary statistics"
