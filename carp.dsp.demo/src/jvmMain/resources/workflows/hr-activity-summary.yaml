schemaVersion: "1.0"
metadata:
  id: "hr-activity-summary"
  name: "Heart Activity Summary"
  description: "Three-step wearable data pipeline: generate synthetic HR + step data, compute daily features, and produce a summary chart. Demonstrates DSP workflow packaging and CWL export."
  version: "1.0"
  tags:
    - "heart-rate"
    - "activity"
    - "wearable"
    - "python"
    - "demo"

environments:
  env-conda:
    name: "hr-activity"
    kind: "pixi"
    spec:
      pythonVersion:
        - "3.11"
      dependencies:
        - "pypi:matplotlib"

steps:
  - id: "load-data"
    metadata:
      name: "Load Data"
      description: "Generate 7 days of synthetic hourly heart rate and step count data"
      version: "1.0"
    environmentId: "env-conda"
    dependsOn: []
    task:
      type: "python"
      id: "task-load-data"
      name: "load-data"
      entryPoint:
        type: "script"
        scriptPath: "scripts/hr_activity/load_data.py"
      args:
        - "--output"
        - "output.0"
    outputs:
      - id: "hr-steps-csv"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Hourly wearable data: timestamp, heart_rate_bpm, steps"

  - id: "compute-features"
    metadata:
      name: "Compute Features"
      description: "Aggregate hourly data to daily features: mean HR, resting HR, peak HR, total steps, active hours"
      version: "1.0"
    environmentId: "env-conda"
    dependsOn:
      - "load-data"
    task:
      type: "python"
      id: "task-compute-features"
      name: "compute-features"
      entryPoint:
        type: "script"
        scriptPath: "scripts/hr_activity/compute_features.py"
      args:
        - "--input"
        - "input.0"
        - "--output"
        - "output.0"
    inputs:
      - id: "hr-steps-csv"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Hourly wearable data"
        source:
          type: "step-output"
          stepId: "load-data"
          outputId: "hr-steps-csv"
    outputs:
      - id: "daily-features-csv"
        descriptor:
          fileFormat: "csv"
          encoding: "utf-8"
          notes: "Daily summary features: date, mean_hr, resting_hr, peak_hr, total_steps, active_hours"

  # Plotting is not specific to this study, so it is a certified library step
  # referenced by `uses:` rather than a script maintained here. The preceding two
  # steps stay inline: generating this cohort's data and deriving its features is
  # particular to the demo.
  - id: "visualise"
    uses: "core.viz.visualise"
    dependsOn:
      - "compute-features"
    inputs:
      - id: "daily-features"
        source:
          type: "step-output"
          stepId: "compute-features"
          outputId: "daily-features-csv"
