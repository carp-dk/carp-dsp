schemaVersion: "1.0"
metadata:
  id: "wf-activity-summary-v2"
  name: "Activity Summary (library steps)"
  description: >-
    HR + step-count pipeline over the open Fitbit dataset (Zenodo 53894), built
    entirely from certified library steps referenced with `uses:`. Fetches the two
    raw files, puts each into the library schema, then keeps the two signals apart
    for as long as they have nothing to say to each other: each is cleaned and
    aggregated to daily features by its own sensing step. The two are brought
    together twice, for the two things that genuinely need both - an interval-level
    join feeding the active/inactive heart-rate contrast, and a daily join feeding
    the summary and the plot. v2 of wf-activity-summary: same analysis, now by
    reference to the shared library rather than inline scripts.
  version: "2.0"
  tags:
    - "heart-rate"
    - "activity"
    - "wearable"
    - "reuse"
    - "library"

steps:
  - id: "fetch-steps"
    uses: "core.io.fetch-zenodo"
    # default args fetch the hourly step counts

  - id: "fetch-hr"
    uses: "core.io.fetch-zenodo"
    args:
      - "--member"
      - "Fitabase Data 4.12.16-5.12.16/heartrate_seconds_merged.csv"

  - id: "shape-steps"
    uses: "core.reshape.select-columns"
    dependsOn:
      - "fetch-steps"
    inputs:
      - id: "table"
        source:
          type: "step-output"
          stepId: "fetch-steps"
          outputId: "file"
    args:
      - "--rename"
      - "Id:participant_id,ActivityHour:timestamp,StepTotal:steps"
      - "--columns"
      - "participant_id,timestamp,steps"

  - id: "shape-hr"
    uses: "core.reshape.select-columns"
    dependsOn:
      - "fetch-hr"
    inputs:
      - id: "table"
        source:
          type: "step-output"
          stepId: "fetch-hr"
          outputId: "file"
    args:
      - "--rename"
      - "Id:participant_id,Time:timestamp,Value:heart_rate_bpm"
      - "--columns"
      - "participant_id,timestamp,heart_rate_bpm"

  - id: "clean-steps"
    uses: "sensing.steps.clean"
    dependsOn:
      - "shape-steps"
    inputs:
      - id: "raw-steps"
        source:
          type: "step-output"
          stepId: "shape-steps"
          outputId: "selected"

  - id: "clean-hr"
    uses: "sensing.heartrate.clean"
    dependsOn:
      - "shape-hr"
    inputs:
      - id: "raw-heart-rate"
        source:
          type: "step-output"
          stepId: "shape-hr"
          outputId: "selected"

  - id: "daily-steps"
    uses: "sensing.steps.daily-features"
    dependsOn:
      - "clean-steps"
    inputs:
      - id: "steps"
        source:
          type: "step-output"
          stepId: "clean-steps"
          outputId: "clean-steps"

  - id: "daily-hr"
    uses: "sensing.heartrate.daily-features"
    dependsOn:
      - "clean-hr"
    inputs:
      - id: "heart-rate"
        source:
          type: "step-output"
          stepId: "clean-hr"
          outputId: "clean-heart-rate"

  # Interval-level join: the contrast compares heart rate inside and outside
  # active intervals, so it needs the two signals aligned per interval.
  - id: "join-intervals"
    uses: "core.reshape.join-tables"
    dependsOn:
      - "clean-steps"
      - "clean-hr"
    inputs:
      - id: "left"
        source:
          type: "step-output"
          stepId: "clean-steps"
          outputId: "clean-steps"
      - id: "right"
        source:
          type: "step-output"
          stepId: "clean-hr"
          outputId: "clean-heart-rate"
    args:
      - "--on"
      - "participant_id,timestamp"
      - "--how"
      - "outer"

  - id: "contrast"
    uses: "analysis.activity.hr-activity-contrast"
    dependsOn:
      - "join-intervals"
    inputs:
      - id: "hr-steps"
        source:
          type: "step-output"
          stepId: "join-intervals"
          outputId: "joined"

  # Daily join: one row per participant-day carrying both signals' features.
  - id: "join-daily"
    uses: "core.reshape.join-tables"
    dependsOn:
      - "daily-steps"
      - "daily-hr"
    inputs:
      - id: "left"
        source:
          type: "step-output"
          stepId: "daily-steps"
          outputId: "daily-steps"
      - id: "right"
        source:
          type: "step-output"
          stepId: "daily-hr"
          outputId: "daily-heart-rate"
    args:
      - "--on"
      - "participant_id,date"
      - "--how"
      - "outer"

  - id: "summarise"
    uses: "core.stats.summarise"
    dependsOn:
      - "join-daily"
    inputs:
      - id: "table"
        source:
          type: "step-output"
          stepId: "join-daily"
          outputId: "joined"

  - id: "visualise"
    uses: "core.viz.visualise"
    dependsOn:
      - "join-daily"
    inputs:
      - id: "table"
        source:
          type: "step-output"
          stepId: "join-daily"
          outputId: "joined"
    args:
      - "--line"
      - "total_steps,resting_hr"
      - "--histogram"
      - "total_steps"
      - "--scatter"
      - "total_steps:mean_hr"
