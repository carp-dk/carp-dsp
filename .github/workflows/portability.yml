name: cross-os evals

# PL3 and EX2 on Linux, macOS (arm64) and Windows runners, through CARP-DSP itself:
#   evalPlannerDeterminism - plan hashes of 11 demo workflows  -> planner-determinism/<platform>.csv
#   evalGaitPortability    - output hashes of the locked gait workflow -> gait-portability/<platform>.csv
# The collect job merges every runner's files into one artifact laid out like
# carp.dsp.demo/eval_results/. Unzip it there and run the evals locally (or with
# -PpaperDir) to compare all platforms and write the macros.
#
# workflow_dispatch shows a Run button only once this file is on the default branch; until
# then the push trigger (work branch + this file) runs it.
on:
  workflow_dispatch:
  push:
    branches: [feat/claims-review]
    paths:
      - '.github/workflows/portability.yml'
      - 'carp.dsp.demo/src/jvmMain/kotlin/carp/dsp/demo/eval/PlannerDeterminismEval.kt'
      - 'carp.dsp.demo/src/jvmMain/kotlin/carp/dsp/demo/eval/GaitPortabilityEval.kt'
      - 'carp.dsp.demo/src/jvmMain/resources/workflows/**'
      - 'carp.dsp.demo/src/jvmMain/resources/scripts/mobgap/**'

permissions:
  contents: read

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      USE_LOCAL_CORE: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          path: carp-dsp

      - uses: actions/checkout@v4
        with:
          repository: cph-cachet/carp.core-kotlin
          ref: feature/core-analytics
          path: carp.core-kotlin

      - uses: actions/checkout@v4
        with:
          repository: carp-dk/health-workflow-interfaces
          path: health-workflow-interfaces

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # pixi provisions the gait workflow's environment from its lock file.
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: false

      - name: Run the cross-machine evals
        working-directory: carp-dsp
        run: |
          chmod +x gradlew
          ./gradlew :carp.dsp.demo:evalPlannerDeterminism :carp.dsp.demo:evalGaitPortability -PskipIntegration

      - uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ matrix.os }}
          path: |
            carp-dsp/carp.dsp.demo/eval_results/planner-determinism/*.csv
            carp-dsp/carp.dsp.demo/eval_results/gait-portability/
          if-no-files-found: error

  collect:
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-results-*
          path: merged
          merge-multiple: true

      - name: Summary
        run: |
          echo "### Platforms" >> "$GITHUB_STEP_SUMMARY"
          for f in merged/planner-determinism/*.csv merged/gait-portability/*.csv; do
            echo "- $f: $(sed -n 2p "$f" | cut -d, -f1)" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cross-os-results
          path: merged/