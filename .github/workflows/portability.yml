name: portability

# Cross-OS output determinism: run the HR/step pipeline natively on Linux, macOS, and
# Windows runners under the same pinned env, then compare output hashes. Complements the
# local Docker eval (which only varies Linux distros).
#
# workflow_dispatch only shows a Run button once this file is on the default branch. Until
# then, the push trigger (scoped to the work branch + relevant paths) runs it on push.
on:
  workflow_dispatch:
  push:
    branches: [feature/eval-exp]
    paths:
      - 'carp.dsp.demo/docker/portability/ci/**'
      - 'carp.dsp.demo/src/jvmMain/resources/scripts/hr_lib/**'
      - '.github/workflows/portability.yml'

permissions:
  contents: read

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Pixi env
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: carp.dsp.demo/docker/portability/ci/pixi.toml
          locked: false

      - name: Run pipeline + fingerprint outputs
        run: |
          pixi run --manifest-path carp.dsp.demo/docker/portability/ci/pixi.toml \
            python carp.dsp.demo/docker/portability/ci/run_and_hash.py \
              --hr-lib carp.dsp.demo/src/jvmMain/resources/scripts/hr_lib \
              --workdir "${RUNNER_TEMP}/ws" \
              --out "fingerprint-${{ matrix.os }}.txt"

      - name: Upload fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-${{ matrix.os }}
          path: fingerprint-${{ matrix.os }}.txt

      - name: Collect output files
        run: |
          mkdir -p pipeline-out
          cp "${RUNNER_TEMP}/ws/hr-steps.csv" \
             "${RUNNER_TEMP}/ws/daily-features.csv" \
             "${RUNNER_TEMP}/ws/summary.json" pipeline-out/

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: outputs-${{ matrix.os }}
          path: pipeline-out/

  compare:
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all fingerprints
        uses: actions/download-artifact@v4
        with:
          path: fps
          pattern: fingerprint-*
          merge-multiple: true

      - name: Compare across OSes
        run: |
          set +e
          python3 carp.dsp.demo/docker/portability/ci/compare_os.py \
            fps ubuntu-latest macos-latest windows-latest --out os-results
          code=$?
          [ -f os-results/portability-os.txt ] && cat os-results/portability-os.txt >> "$GITHUB_STEP_SUMMARY"
          # exit 2 = outputs diverged across OSes (a valid result); exit 1 = real error
          [ "$code" -eq 1 ] && exit 1 || exit 0

      - name: Download per-OS outputs
        uses: actions/download-artifact@v4
        with:
          path: outs
          pattern: outputs-*
          # no merge-multiple: keep each OS in its own subdir (files share names)

      - name: Locate the divergence (column-level)
        run: |
          python3 -m pip install --quiet pandas numpy
          for f in daily-features.csv hr-steps.csv; do
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            python3 carp.dsp.demo/docker/portability/ci/diff_outputs.py \
              outs "$f" ubuntu-latest macos-latest windows-latest --out "os-results/$f-detail" \
              | tee -a "$GITHUB_STEP_SUMMARY" || true
          done

      - name: Upload cross-OS results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portability-os-results
          path: os-results/
