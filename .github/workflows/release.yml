name: Release

# Builds a v* tag and publishes it as a GitHub release (Zenodo archives the release and
# mints its DOI). CARP Core and health-workflow-interfaces are built from source, pinned
# to the commits this version was built and evaluated against (README, "Building v1.0.0").

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: carp-dsp

      - uses: actions/checkout@v4
        with:
          repository: cph-cachet/carp.core-kotlin
          ref: 278d2a575acc074e3678d4e1ab5fdd3ba220949a  # feature/core-analytics
          path: carp.core-kotlin

      - uses: actions/checkout@v4
        with:
          repository: carp-dk/health-workflow-interfaces
          ref: c332d00aac0a5b925e88a90104129e1ccbe4a598  # main
          path: health-workflow-interfaces

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Integration tests (Docker, R, server) already ran in CI on main.
      - name: Build and test
        working-directory: carp-dsp
        run: |
          chmod +x gradlew
          ./gradlew build -PskipIntegration

      - name: Build release jars
        working-directory: carp-dsp
        run: ./gradlew :carp.dsp.core:jvmJar :carp.dsp.steps:jvmJar :carp.dsp.demo:jvmJar

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            carp-dsp/carp.dsp.core/build/libs/*.jar
            carp-dsp/carp.dsp.steps/build/libs/*.jar
            carp-dsp/carp.dsp.demo/build/libs/*.jar
          body: |
            CARP-DSP ${{ github.ref_name }}: declarative, reproducible analysis workflows for mobile sensing data.

            - `carp.dsp.core`: workflow authoring, planning, execution and sharing
            - `carp.dsp.steps`: the typed step library
            - `carp.dsp.demo`: use cases and the paper's evaluations

            Built against CARP Core `278d2a57` (feature/core-analytics) and
            health-workflow-interfaces `c332d00a`; see the README for building from source.
